# KTP Tier 1 — compile gate for the file distributor.
#
# This service watches /home/dod/distribute on the data server and pushes any
# created or changed file to all 24 fleet instances within ~15s. It had no CI
# at all, so a change that does not compile would have been found by deploying
# it. Built on ubuntu-latest because that is where it actually runs.
#
# ⚠️ NOT `paths:`-filtered, deliberately. If this ever becomes a required
# status check, a filtered workflow is silently skipped on an unrelated PR, the
# check never reports, and the branch cannot be merged.

name: Tier 1 Build

on:
  # push only on the protected branch: `pull_request` is what reports on a PR,
  # so firing on every branch push would run the same job twice.
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: dotnet build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to the project's TargetFramework rather than "latest" so the
          # analyzer set is predictable -- a newer SDK can introduce warnings
          # the author never saw, which matters because of -warnaserror below.
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KTPFileDistributor/KTPFileDistributor.csproj

      - name: Build
        # -warnaserror is affordable because the project's own code is
        # warning-clean today (verified: 0 warnings, 0 errors). It locks that
        # in: with <Nullable> enabled the warnings it catches are mostly
        # null-safety, which is the class you least want on a box that writes
        # to all 24 instances.
        #
        # NuGet audit codes (NU190x) are carved out deliberately. They are
        # externally controlled and time-dependent: an advisory published
        # upstream tomorrow would hard-fail every PR in this repo with no code
        # change, which is the "required check that cannot pass" failure mode.
        # They still surface as warnings, and the audit step below reports them.
        run: >
          dotnet build KTPFileDistributor/KTPFileDistributor.csproj
          -c Release --no-restore -warnaserror
          "-p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"

      - name: Dependency audit
        # Non-blocking on purpose (see above), but written to the job summary so
        # a vulnerable dependency is visible rather than buried in build logs.
        if: always()
        run: |
          set -uo pipefail
          OUT="$(dotnet list KTPFileDistributor/KTPFileDistributor.csproj package                  --vulnerable --include-transitive 2>&1 || true)"
          echo "$OUT"
          if echo "$OUT" | grep -q "has the following vulnerable packages"; then
            {
              echo "### :warning: Vulnerable dependencies"
              echo
              echo '```'
              echo "$OUT" | sed -n '/vulnerable packages/,$p'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::vulnerable NuGet package(s) present - see the job summary"
          else
            echo "no vulnerable packages reported" >> "$GITHUB_STEP_SUMMARY"
          fi
